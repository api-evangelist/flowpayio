aid: flowpayio
name: flowpay.io
description: >-
  Flowpay is an embedded-lending fintech that provides fast, flexible,
  non-purpose financing of up to EUR 100,000 to small and medium-sized
  businesses across the Czech Republic, Slovakia, and the Netherlands. Its
  AI-driven platform lets e-commerce, point-of-sale, accounting, and banking
  partners embed an end-to-end lending journey - customer onboarding and
  identity verification, open-banking and sales-transaction data ingestion,
  personalized offer generation, and financing origination, document signing,
  and repayment - directly into their own products via a REST partner API,
  hosted iframe/linkout surfaces, and a modular JavaScript/React embed SDK.
  Authentication is OAuth 2.0 client-credentials (Auth0), with HMAC-SHA256
  signed webhooks for customer-scoring and financing-state events. Flowpay is a
  Techstars-backed company.
