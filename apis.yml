apis:
- name: Flowpay Partner API
  description: >-
    Flowpay's REST partner API for the Fully Embedded (Native) lending flow -
    customer onboarding and service activation, open-banking account and
    transaction ingestion, offer request/recalculation/retrieval, and financing
    origination and management. JSON over HTTPS, OAuth 2.0 client-credentials,
    HAL-style error envelope, HMAC-signed webhooks.
  humanURL: https://developers.flowpay.io/specifications/fully-embedded-api/
  baseURL: https://api.flowpay.io
  tags:
  - Lending
  - Embedded Finance
  - Open Banking
  properties:
  - type: Documentation
    url: https://developers.flowpay.io/specifications/fully-embedded-api/
  - type: Sandbox
    url: sandbox/flowpayio-sandbox.yml
- name: Flowpay Sales Transactions API
  description: >-
    Partner-implemented endpoint (GET /v1/sales) that supplies Flowpay with a
    merchant's paginated sales/order history (status, delivery, payment,
    currency, totals, line items) so Flowpay can score and personalize
    financing offers. Supports API-key or OAuth 2.0 auth and incremental sync
    via updatedAt.
  humanURL: https://developers.flowpay.io/specifications/sales-transactions-api/
  baseURL: https://api.flowpay.io
  tags:
  - Open Banking
  - Data
  properties:
  - type: Documentation
    url: https://developers.flowpay.io/specifications/sales-transactions-api/
